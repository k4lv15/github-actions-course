name: "19 - 1 - Managing Concurrency"
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
      - name: "Ping URL"
        uses: $/.github/actions/docker-ping-url
        with:
          url: "https://my-fancy-site.keycode.lv"
          max_trials: 20
          delay: 5