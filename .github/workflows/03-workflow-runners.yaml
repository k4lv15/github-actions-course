name: "03 - Workflow Runners"
on:
  workflow_dispatch:
  push:

jobs:
  ubuntu-echo:
    name: "Ubuntu runner"
    runs-on: ubuntu-latest
    steps:
      - name: "Show OS"
        run: |
          echo "This job is running on an Ubuntu runner."
          cat /etc/os-release | grep PRETTY_NAME
          echo "Runner OS: $RUNNER_OS"
