name: "15 - Working with Matrices"
on:
  workflow_dispatch:
env:
  build-artifact-key: app-${{ github.sha }}
  test-coverage-key: test-coverage-${{ github.sha }}
jobs:
  backwards-compatibility:
    name: "${{ matrix.os }}-${{ matrix.node-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [24.x, 26.x]
        os: [ubuntu-latest, windows-latest]
        include:
          - node-version: 25.x
            os: ubuntu-latest
          - node-version: 26.x
            os: ubuntu-latest
            tag: experimental
    steps:
      - name: "Setup node"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: "Fail if experimental"
        if: ${{ matrix.tag == 'experimental' }}
        run: exit 1
      - name: "Perform some tests"
        run: |
          echo "Running tests on OS ${{ runner.os }} and NodeJS ${{ matrix.node-version }}"
          sleep 10
      - name: "Upload test results"
        run: |
          echo "Uploading test results"
  include-example:
    name: "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: [red, green]
        shape: [circle, square]
        size: [small, large]
        include:
          - color: red
            opacity: 75
          - shape: circle
            opacity: 100
          - color: red
            shape: triangle
          - opacity: 50
        exclude:
          - color: green
            shape: circle
    steps:
      - name: "Dummy step"
        run: |
          echo "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}"
