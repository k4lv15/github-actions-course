name: "04 - Using actions"
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7
      - name: "Setup Node"
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: "Install dependencies"
        working-directory: ./04-using-actions/react-app
        run: |
          npm ci
      - name: "Run unit tests"
        working-directory: ./04-using-actions/react-app
        run: |
          npm run test