name: "Cache Node and NPM Dependencies"
description: "This action allows to cache both Node and NPM dependencies based on the package-lock.json file."
inputs:
  node-version:
    description: "Node version"
    required: true
    default: 24.x
  working-dir:
    description: "Working directory"
    required: true
    default: ${{ github.workspace }}
  target-env:
    description: '"dev" or "prod". Controls whether dev dependencies are installed'
    required: false
    default: dev
runs:
  using: composite
  steps:
    - name: "Setup NodeJS version ${{ inputs.node-version }}"
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - name: "Cache dependencies"
      uses: actions/cache@v6
      id: cache
      with:
        path: ${{ format('{0}/{1}', inputs.working-dir, 'node_modules') }}
        key: node-deps-${{ inputs.target-env }}-${{ hashFiles(format('{0}/{1}', inputs.working-dir, 'package-lock.json')) }}
    - name: "Install dependencies"
      shell: bash
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      working-directory: ${{ inputs.working-dir }}
      run: |
        if ["${{ inputs.target-env }}" == "dev"]; then
          npm ci
        else
          npm ci --omit=dev
        fi